[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slab"
version = "0.1.0"
description = "Simplest Layer for Atomistic Backends — agent-native workflow orchestration for atomistic materials modeling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["materials-science", "workflow", "orchestration", "atomistic", "agents"]
dependencies = [
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/slab"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --doctest-modules --cov=slab --cov-report=term-missing"
testpaths = ["tests", "src/slab"]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    '^\s*\.\.\.$',
    'if TYPE_CHECKING:',
]
