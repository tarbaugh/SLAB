[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slab"
version = "0.1.0"
description = "Simplest Layer for Atomistic Backends — agent-native workflow orchestration for atomistic materials modeling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["materials-science", "workflow", "orchestration", "atomistic", "agents"]
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "ase>=3.23",
]

[project.optional-dependencies]
mace = [
    "mace-torch>=0.3.10",
]
rootstock = [
    "rootstock>=1.4",
]
mcp = [
    "mcp>=1.2",
]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "mcp>=1.2",
    "rootstock>=1.4",
]
docs = [
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://github.com/tarbaugh/SLAB"
Documentation = "https://tarbaugh.github.io/SLAB/"
Source = "https://github.com/tarbaugh/SLAB"

[project.scripts]
slab = "slab.cli:app"
foundation = "foundation.cli:app"
mason = "mason.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/slab", "src/foundation", "src/mason"]

[tool.hatch.build.targets.sdist]
exclude = [".claude"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Recorded fixtures are historical artifacts. Their imports name the module
# paths that existed when they were recorded, and reformatting them would
# quietly edit the evidence.
extend-exclude = ["tests/data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]

# No python_version pin: numpy 2.x type stubs use PEP-695 syntax that mypy
# only accepts when targeting >=3.12. Source stays 3.11-compatible (CI matrix
# is the guardian of that, not the type checker).
[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ase.*", "mace.*", "rootstock.*", "mcp.server.fastmcp"]
ignore_missing_imports = true

# These two modules call into ASE, which is only partially typed; everything
# else about them stays strict.
[[tool.mypy.overrides]]
module = ["foundation.tasks", "slab.backends"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
# --doctest-modules collects every .py file, so the recorded fixture workspace
# (whose script imports the pre-split module paths on purpose) is skipped.
addopts = "-q --doctest-modules --ignore=tests/data --cov=slab --cov=foundation --cov=mason --cov-report=term-missing"
testpaths = ["tests", "src"]
filterwarnings = [
    # ASE-internal numpy 2.5 deprecations; not ours to fix
    "ignore::DeprecationWarning:ase.*",
]

[tool.coverage.report]
fail_under = 80
exclude_also = [
    '^\s*\.\.\.$',
    'if TYPE_CHECKING:',
]
